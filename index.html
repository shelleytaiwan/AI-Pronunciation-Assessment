<style>

<script>
/* ===== 內嵌配音：由「生成配音.py」把音檔填進下面的 AUDIO；沒有音檔的項目會自動改用瀏覽器語音 ===== */
window.AUDIO=/*AUDIO_BEGIN*/{}/*AUDIO_END*/;
window.SPK_SVG='<svg class="ico-spk" viewBox="0 0 1166 896" aria-hidden="true"><path fill="currentColor" d="M95 232H203L455 14Q500 -10 535 20Q552 38 552 62V834Q552 862 535 878Q500 905 455 878L203 663H95Q0 663 0 568V327Q0 232 95 232Z"/><g fill="none" stroke="currentColor" stroke-width="62" stroke-linecap="round"><path d="M722 352C762 385 770 420 770 448C770 476 762 511 722 544"/><path d="M838 207C915 270 951 350 951 448C951 546 915 626 838 685"/><path d="M955 65C1070 160 1135 300 1135 448C1135 596 1070 736 955 830"/></g></svg>';
(function(){
  var AC=window.AudioContext||window.webkitAudioContext, ctx=null, bufs={}, srcs=[], seq=0, keep=[], voices=[], el=null;
  function haltTTS(){ try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){} }
  function getCtx(){
    if(!AC) return null;
    if(!ctx){ try{ ctx=new AC(); }catch(e){ return null; } }
    if(ctx.state==='suspended'){ try{ ctx.resume(); }catch(e){} }
    return ctx;
  }
  function toArrayBuffer(uri){
    var b=atob(uri.slice(uri.indexOf(',')+1)), u=new Uint8Array(b.length);
    for(var i=0;i<b.length;i++) u[i]=b.charCodeAt(i);
    return u.buffer;
  }
  // 切掉音檔前後的靜音，接起來才會連貫
  function trim(buf){
    var d=buf.getChannelData(0), th=0.012, s=0, e=d.length-1, sr=buf.sampleRate;
    while(s<e && Math.abs(d[s])<th) s++;
    while(e>s && Math.abs(d[e])<th) e--;
    s=Math.max(0,s-Math.round(0.012*sr)); e=Math.min(d.length-1,e+Math.round(0.03*sr));
    return {buf:buf, off:s/sr, dur:(e-s+1)/sr};
  }
  function load(k){
    if(bufs[k]) return bufs[k];
    var c=getCtx();
    bufs[k]=new Promise(function(res,rej){
      var ok=function(b){ res(trim(b)); };
      var r=c.decodeAudioData(toArrayBuffer(window.AUDIO[k]),ok,rej);
      if(r&&r.then) r.then(ok,rej);
    });
    return bufs[k];
  }
  function stopSources(){ srcs.forEach(function(s){ try{ s.stop(); }catch(e){} }); srcs=[]; }
  window.clipReady=function(k){ return !!window.AUDIO[k]; };
  window.stopClips=function(){ seq++; stopSources(); try{ if(el) el.pause(); }catch(e){} };
  // 備用：沒有 WebAudio 時，用 <audio> 一段一段播
  function viaElement(keys,gap,my){
    if(!el) el=new Audio();
    var n=0;
    (function next(){
      if(my!==seq||n>=keys.length) return;
      el.src=window.AUDIO[keys[n++]];
      el.onended=function(){ if(my===seq) setTimeout(next,gap); };
      var p=el.play(); if(p&&p.catch) p.catch(function(){});
    })();
  }
  // 依序、無縫地播放一串音檔。每一段都有音檔才會播並回傳 true；否則回傳 false，讓呼叫端改用瀏覽器語音
  window.playClips=function(keys,gap){
    if(!keys||!keys.length) return false;
    for(var i=0;i<keys.length;i++){ if(!window.AUDIO[keys[i]]) return false; }
    gap=(gap==null?20:gap);
    haltTTS(); stopSources(); try{ if(el) el.pause(); }catch(e){}
    var my=++seq, c=getCtx();
    if(!c){ viaElement(keys,gap,my); return true; }
    Promise.all(keys.map(load)).then(function(items){
      if(my!==seq) return;
      var t=c.currentTime+0.05;
      items.forEach(function(it){
        var s=c.createBufferSource(); s.buffer=it.buf; s.connect(c.destination);
        s.start(t,it.off,it.dur); srcs.push(s); t+=it.dur+gap/1000;
      });
    }).catch(function(){ if(my===seq) viaElement(keys,gap,my); });
    return true;
  };
  window.playClip=function(k){ return window.playClips([k],0); };
  // 瀏覽器語音（備用）：必須在使用者點擊的同一個動作裡「立刻」呼叫（Safari 的限制）
  window.__spk=function(u){
    if(!window.speechSynthesis) return;
    window.stopClips();
    keep.push(u);
    var done=function(){ var i=keep.indexOf(u); if(i>-1) keep.splice(i,1); };
    u.addEventListener('end',done); u.addEventListener('error',done);
    try{ speechSynthesis.resume(); }catch(e){}
    speechSynthesis.speak(u);
  };
  window.speakTTS=function(text,lang){
    if(!window.speechSynthesis||!text) return;
    try{ voices=speechSynthesis.getVoices()||[]; }catch(e){}
    var L=function(v){ return (v.lang||'').toLowerCase().replace('_','-'); };
    var v=voices.find(function(x){ return /mei-?jia|美佳/i.test(x.name); })
       || voices.find(function(x){ return /ting-?ting|婷婷/i.test(x.name); })
       || voices.find(function(x){ return L(x)===(lang||'zh-TW').toLowerCase(); })
       || voices.find(function(x){ return L(x).indexOf('zh')===0; });
    var u=new SpeechSynthesisUtterance(text);
    u.lang=(v&&v.lang)||lang||'zh-TW'; if(v) u.voice=v; u.rate=.85;
    try{ speechSynthesis.cancel(); }catch(e){}
    window.__spk(u);
  };
  try{ if(window.speechSynthesis) speechSynthesis.getVoices(); }catch(e){}
})();

const $=id=>document.getElementById(id);
const PUN='，。！？、；：,.!?;:…—「」『』（）()“”"\'’‘《》';
const CN='零一二三四五六七八九';
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const norm=c=>{const n=c.normalize('NFKC');return n.length==1?n:c};
const clean=s=>s.replace(/[，。！？、；：,.!?;:\s]/g,'');
function num2(n){return n<10?CN[n]:(n<20?'':CN[n/10|0])+'十'+(n%10?CN[n%10]:'')}
function numStr(r){if(r.length==1)return CN[r];if(r.length==2&&r[0]!='0')return num2(+r);return [...r].map(d=>CN[d]).join('')}
function tok(chars,withIdx){const T=[],E=[];let i=0;
 while(i<chars.length){const c=chars[i];
  if(/[0-9]/.test(c)){let j=i;while(j<chars.length&&/[0-9]/.test(chars[j]))j++;
   const idx=[];for(let k=i;k<j;k++)idx.push(k);
   for(const ch of numStr(chars.slice(i,j).join('')))T.push({ch,idx,end:j});i=j;continue}
  if(/[\u3400-\u9fff]/.test(c)||/[A-Za-z]/.test(c))T.push({ch:c.toLowerCase(),idx:[i],end:i+1});
  else if(withIdx&&(PUN.includes(c)||c=='\n')&&T.length&&!E.some(e=>e.b==T.length))E.push({b:T.length,at:i});
  i++}
 return{T,E}}
function align(a,b){const n=a.length,m=b.length,D=Array.from({length:n+1},()=>new Uint16Array(m+1));
 for(let i=0;i<=n;i++)D[i][0]=i;for(let j=0;j<=m;j++)D[0][j]=j;
 for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)D[i][j]=Math.min(D[i-1][j]+1,D[i][j-1]+1,D[i-1][j-1]+(a[i-1]==b[j-1]?0:1));
 let i=n,j=m;const ops=[];
 while(i>0||j>0){const sub=i>0&&j>0&&D[i][j]==D[i-1][j-1]+(a[i-1]==b[j-1]?0:1);
  if(sub){ops.push(a[i-1]==b[j-1]?'M':'S');i--;j--}
  else if(i>0&&D[i][j]==D[i-1][j]+1){ops.push('D');i--}
  else{ops.push('I');j--}}
 return ops.reverse()}
function punctuate(raw,pauses){const m=new Map();
 pauses.forEach(p=>{if(p.pos>0&&p.pos<raw.length)m.set(p.pos,p.dur>=1.6?'。':'，')});
 let o='';for(let i=0;i<raw.length;i++){if(m.has(i))o+=m.get(i);o+=raw[i]}
 return o+(raw?'。':'')}
function evaluate(orig,raw,pauses){
 const rawO=[...orig],O=tok(rawO.map(norm),true),Tt=tok([...raw].map(norm),false).T,n=O.T.length;
 const ops=align(O.T.map(x=>x.ch),Tt.map(x=>x.ch));
 let oi=0,ti=0,M=0,S=0,D=0,I=0;const st=Array(n).fill(0),tEnd=[0];
 for(const op of ops){
  if(op=='M'){M++;oi++;ti++}else if(op=='S'){S++;st[oi]=1;oi++;ti++}
  else if(op=='D'){D++;st[oi]=1;oi++}else{I++;ti++}
  if(op!='D')tEnd[ti]=oi}
 const act=[];
 pauses.forEach(p=>{const k=Tt.filter(x=>x.end<=p.pos).length;
  if(k>0&&k<Tt.length){const b=tEnd[k];if(b>0&&b<n&&!act.some(a=>a.b==b))act.push({b,dur:p.dur})}});
 const E=O.E.filter(e=>e.b<n);
 const missed=E.filter(e=>!act.some(a=>Math.abs(a.b-e.b)<=1));
 const unexp=act.filter(a=>!E.some(e=>Math.abs(e.b-a.b)<=1));
 const bad=new Set(),ul=new Set(),sl=new Set();
 st.forEach((s,i)=>{if(s)O.T[i].idx.forEach(k=>bad.add(k))});
 unexp.forEach(a=>[a.b-1,a.b].forEach(i=>O.T[i].idx.forEach(k=>ul.add(k))));
 missed.forEach(e=>sl.add(e.at));
 const html=rawO.map((c,i)=>{
  if(c=='\n')return(sl.has(i)?'<span class="sl">/</span>':'')+'<br>';
  let h=esc(c);if(bad.has(i))h=`<span class="bad">${h}</span>`;if(ul.has(i))h=`<span class="ul">${h}</span>`;
  return h+(sl.has(i)?'<span class="sl">/</span>':'')}).join('');
 const tot=M+S+D+I||1;
 const acc=Math.round(100*M/tot),comp=n?Math.round(100*(n-D)/n):0;
 const flu=Math.max(0,100-8*unexp.length-3*I-2*missed.length);
 const all=Math.round(.4*acc+.3*flu+.3*comp);
 return{html,acc,flu,comp,all,wrong:S,miss:D,extra:I,unexp:unexp.length,missed:missed.length}}

function apply(){document.documentElement.lang=mode=='T'?'zh-Hant':'zh-Hans';document.title=t('title');
 document.querySelectorAll('[data-k]').forEach(e=>{if(e.dataset.h)e.innerHTML=t(e.dataset.k);else e.textContent=t(e.dataset.k)});
 $('src').placeholder=t('ph');ui(on);if(!cur()){$('live').className='mu';$('live').textContent=t('lvph')}}
$('mT').onclick=()=>setMode('T');$('mS').onclick=()=>setMode('S');
function setMode(m){if(m==mode)return;if(on)stop();stopTTS();mode=m;$('mT').classList.toggle('pri',m=='T');$('mS').classList.toggle('pri',m=='S');
 base=fin=interim='';$('res').hidden=true;msg('');apply()}
let rec,on=false,base='',fin='',interim='',pauses=[],done=false,lastLen=0,lastT=0,errCode='';
const cur=()=>base+fin+interim;
let cvt=null,cvm='';
function conv(x){try{if(typeof OpenCC=='undefined')return x;
 if(cvm!=mode){cvt=mode=='T'?OpenCC.Converter({from:'cn',to:'tw'}):OpenCC.Converter({from:'tw',to:'cn'});cvm=mode}
 return [...x].map(c=>{const o=cvt(c);return o.length==1?o:c}).join('')}catch(e){return x}}
const msg=x=>{$('msg').hidden=!x;$('msg').textContent=x||''};
const show=()=>{$('live').className='';$('live').textContent=punctuate(cur(),pauses)||'…'};
const SIMP='们这为国对时说还会来现发动经过长开关见应问间书让认实头体么几边门车东马买卖钱于学写爱电听进种点';
const TRAD='們這為國對時說還會來現發動經過長開關見應問間書讓認實頭體麼幾邊門車東馬買賣錢於學寫愛電聽進種點';
function scr(x){let s=0,r=0;for(const c of x){if(SIMP.includes(c)&&!TRAD.includes(c))s++;if(TRAD.includes(c)&&!SIMP.includes(c))r++}return s>r?'S':r>s?'T':''}
function bad(x){const g=scr(x);return g&&g!=mode}
function start(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition,x=$('src').value;
 if(!SR){msg(t('nosr'));return}
 if(!x.trim()){msg(t('empty'));return}
 if(bad(x)){msg(t('mm'));return}
 if(mode=='T'&&typeof OpenCC=='undefined'){msg(t('cc'));return}
 stopTTS();msg('');base=fin=interim='';pauses=[];on=true;done=false;lastLen=0;lastT=0;errCode='';$('res').hidden=true;
 rec=new SR();rec.lang=mode=='T'?'zh-TW':'zh-CN';rec.continuous=true;rec.interimResults=true;
 rec.onresult=e=>{let f='',v='';for(let i=0;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)f+=r[0].transcript;else v+=r[0].transcript}
  fin=conv(clean(f));interim=conv(clean(v));const n=cur().length,now=performance.now();
  if(n>lastLen){if(lastLen>0&&now-lastT>=900)pauses.push({pos:lastLen,dur:(now-lastT)/1000});lastLen=n;lastT=now}
  else lastLen=n;
  show()};
 rec.onerror=e=>{errCode=e.error;if(e.error=='not-allowed'||e.error=='service-not-allowed'){on=false;ui(false)}};
 rec.onend=()=>{if(on){base+=fin+interim;fin=interim='';lastLen=base.length;setTimeout(()=>{if(on)try{rec.start()}catch(e){}},150)}else finish()};
 try{rec.start()}catch(e){errCode=String(e)}
 ui(true);$('live').className='mu';$('live').textContent=t('go')}
function ui(r){$('go').textContent=t(r?'stopRec':'rec');$('go').classList.toggle('on',!!r)}
function stop(){on=false;ui(false);try{rec.stop()}catch(e){}setTimeout(finish,1800)}
function finish(){
 if(done)return;done=true;on=false;ui(false);const raw=cur();
 if(!raw){msg(errCode=='not-allowed'||errCode=='service-not-allowed'?t('mic'):t('ns')+(errCode?'（'+t('err')+errCode+'）':'')+'。');return}
 const r=evaluate($('src').value,raw,pauses);
 $('live').className='';$('live').textContent=punctuate(raw,pauses);
 $('res').hidden=false;$('orig').innerHTML=r.html;
 $('sA').textContent=r.acc+'%';$('sF').textContent=r.flu+'%';$('sC').textContent=r.comp+'%';$('sT').textContent=r.all+'%';
 $('res').scrollIntoView({behavior:'smooth'})}
let voices=[];const loadV=()=>{voices=speechSynthesis.getVoices()};
if('speechSynthesis' in window){loadV();speechSynthesis.onvoiceschanged=loadV}
function pickVoice(lang){const ok=v=>v.lang.replace('_','-').toLowerCase().startsWith(lang.toLowerCase())&&!/粵|粤|cantonese|HK/i.test(v.name+v.lang);
 const c=voices.filter(ok);return c.find(v=>/premium|enhanced|natural|增強|優質|增强|优质/i.test(v.name))||c.find(v=>v.localService)||c[0]}
function stopTTS(){if('speechSynthesis' in window)speechSynthesis.cancel()}
function say(){const x=$('src').value.trim();
 if(!('speechSynthesis' in window)){msg(t('nosp'));return}
 if(!x){msg(t('empty'));return}
 if(bad(x)){msg(t('mm'));return}
 if(on)stop();msg('');stopTTS();
 const lang=mode=='T'?'zh-TW':'zh-CN',u=new SpeechSynthesisUtterance([...x].map(norm).join(''));
 u.lang=lang;const v=pickVoice(lang);if(v)u.voice=v;u.rate=+$('rate').value;
 setTimeout(()=>__spk(u),60)}
$('say').onclick=say;$('stp').onclick=stopTTS;
$('go').onclick=()=>on?stop():start();
$('clr').onclick=()=>{if(on)stop();$('src').value='';$('res').hidden=true;msg('');base=fin=interim='';apply()};
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('src').value=String(r.result).trim()};r.readAsText(f,'utf-8');e.target.value=''};
apply();
</script></body></html>
